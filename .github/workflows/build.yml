name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config ccache \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev

      - name: Download Persian font
        run: curl -L -o Vazirmatn-Regular.ttf https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-Regular.ttf

      - name: Install Buildozer (pinned stable versions)
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 python-for-android==2024.1.21 cython==0.29.36

      - name: Build APK
        run: |
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
          set +e
          yes | buildozer -v android debug 2>&1 | tee build.log
          code=${PIPESTATUS[1]}
          set -e
          exit $code

      - name: Show real error (only if build failed)
        if: failure()
        run: |
          echo "==================== LAST 150 LINES ===================="
          tail -n 150 build.log || true
          echo ""
          echo "==================== ERROR LINES ===================="
          grep -nE "Traceback|Command failed|Compile failed|fatal error|non-zero|No such file|ERROR:|error: " build.log | tail -n 40 || true

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
